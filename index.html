<!DOCTYPE html>
<html lang="en" class="h-full w-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#09090b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Smart Clock</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full w-full overflow-hidden select-none bg-black text-white relative">

  <div id="wallpaperLayer" class="wallpaper-layer hidden">
    <div class="wallpaper-overlay"></div>
  </div>

  <div id="portraitWarning" class="portrait-warning fixed inset-0 z-50 flex-col items-center justify-center bg-black/95 p-6 text-center">
    <div class="mb-4 text-5xl text-amber-400"><i class="fa-solid fa-mobile-screen-button rotate-90"></i></div>
    <h2 id="i18nRotateTitle" class="text-xl font-bold text-white mb-2" data-i18n="rotateTitle">Rotate Your Device</h2>
    <p id="i18nRotateDesc" class="text-sm text-gray-400 mb-6" data-i18n="rotateDesc">Smart Clock is optimized for landscape orientation.</p>
    <button id="dismissWarningBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs font-semibold transition" data-i18n="continuePortrait">Continue in Portrait Anyway</button>
  </div>

  <main id="appContainer" class="app-container relative">
    <header class="flex items-center justify-between w-full h-10 z-10">
      <div id="dateHeader" class="flex flex-col justify-center">
        <span id="weekdayEl" class="text-xs font-bold tracking-widest text-zinc-400 uppercase">--</span>
        <span id="dateEl" class="text-sm font-medium text-zinc-200">--</span>
      </div>

      <div class="flex items-center space-x-4">
        <div id="weatherContainer" class="hidden items-center space-x-2 text-xs text-zinc-300 glass-panel px-2.5 py-1 rounded-full">
          <span id="weatherIcon"><i class="fa-solid fa-sun text-amber-400"></i></span>
          <span id="weatherTemp" class="font-semibold">--°C</span>
          <span id="weatherCond" class="hidden sm:inline text-zinc-400 text-[10px]">--</span>
        </div>

        <div id="batteryContainer" class="hidden items-center space-x-1 text-xs text-zinc-300">
          <span id="batteryIcon"><i class="fa-solid fa-battery-full"></i></span>
          <span id="batteryLevel">--%</span>
        </div>

        <div id="networkContainer" class="hidden items-center text-xs">
          <span id="networkStatusIcon" class="mr-1 text-emerald-400"><i class="fa-solid fa-wifi"></i></span>
        </div>
      </div>
    </header>

    <section id="mainClockArea" class="flex-1 flex items-center justify-center w-full relative">
      <div id="digitalClockContainer" class="flex flex-col items-center justify-center text-center transition-all duration-300">
        <div class="flex items-baseline justify-center font-style-modern tabular-nums">
          <span id="hoursEl" class="time-display-huge">10</span>
          <span class="time-display-huge opacity-80 animate-pulse mx-1">:</span>
          <span id="minutesEl" class="time-display-huge">42</span>
          <div id="secondsWrapper" class="flex items-baseline ml-2">
            <span class="time-display-medium opacity-60">:</span>
            <span id="secondsEl" class="time-display-medium opacity-80">36</span>
          </div>
          <span id="ampmEl" class="text-lg font-semibold ml-3 text-zinc-400 self-end mb-3">PM</span>
        </div>
        <div id="timezoneEl" class="hidden text-xs text-zinc-400 mt-1 uppercase tracking-wider">GMT+7</div>
      </div>

      <div id="analogClockContainer" class="hidden w-44 h-44 items-center justify-center p-2"></div>

      <div id="worldClockContainer" class="hidden flex-col space-y-2 ml-6 text-xs border-l border-zinc-800 pl-4 max-h-48 overflow-y-auto">
        <div class="text-[10px] uppercase font-bold text-zinc-500 tracking-wider mb-1">World Clock</div>
        <div id="worldClockList" class="flex flex-col space-y-1.5"></div>
      </div>
    </section>

    <div id="controlsOverlay" class="controls-overlay absolute bottom-4 left-0 right-0 flex items-center justify-center z-20 px-4">
      <div class="glass-panel flex items-center space-x-2 px-3 py-1.5 rounded-full shadow-2xl">
        <button id="toggleModeBtn" class="p-2 text-zinc-300 hover:text-white rounded-full transition" aria-label="Change Mode" title="Clock Mode">
          <i class="fa-solid fa-layer-group"></i>
        </button>
        <button id="toggleNightBtn" class="p-2 text-zinc-300 hover:text-white rounded-full transition" aria-label="Toggle Night Mode" title="Night Mode">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="toggleAmbientBtn" class="p-2 text-zinc-300 hover:text-white rounded-full transition" aria-label="Toggle Ambient Mode" title="Ambient Mode">
          <i class="fa-solid fa-eye-slash"></i>
        </button>
        <button id="toggleFullscreenBtn" class="p-2 text-zinc-300 hover:text-white rounded-full transition" aria-label="Toggle Fullscreen" title="Fullscreen">
          <i class="fa-solid fa-expand"></i>
        </button>
        <div class="h-4 w-[1px] bg-zinc-700 mx-1"></div>
        <button id="openSettingsBtn" class="p-2 text-zinc-300 hover:text-white rounded-full transition" aria-label="Open Settings" title="Settings">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </main>

  <dialog id="settingsModal" class="bg-transparent backdrop:bg-black/80 m-0 p-0 w-full h-full max-w-none max-h-none border-none overflow-hidden z-50">
    <div class="flex items-center justify-center w-full h-full p-4">
      <div class="glass-panel w-full max-w-lg max-h-[90vh] flex flex-col rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
        <header class="flex items-center justify-between px-5 py-3 border-b border-zinc-800">
          <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-sliders text-blue-400"></i>
            <span data-i18n="settingsTitle">Clock Settings</span>
          </h3>
          <button id="closeSettingsBtn" class="p-1.5 text-zinc-400 hover:text-white rounded-lg transition" aria-label="Close Settings">
            <i class="fa-solid fa-xmark text-base"></i>
          </button>
        </header>
        <div class="flex-1 overflow-y-auto p-5 space-y-6 text-xs text-zinc-300">
          
          <section class="space-y-3">
            <h4 class="text-[11px] font-bold uppercase tracking-wider text-zinc-500 flex items-center gap-1.5">
              <i class="fa-solid fa-clock"></i>
              <span data-i18n="clockMode">Clock Layout & Format</span>
            </h4>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="clockMode">Clock Mode</label>
                <select id="settingClockMode" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="digital" data-i18n="digitalOnly">Digital Only</option>
                  <option value="analog" data-i18n="analogOnly">Analog Only</option>
                  <option value="hybrid" data-i18n="hybrid">Hybrid (Digital + Analog)</option>
                  <option value="dashboard" data-i18n="dashboard">Dashboard</option>
                  <option value="ambient" data-i18n="ambient">Ambient</option>
                </select>
              </div>
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="timeFormat">Time Format</label>
                <select id="settingTimeFormat" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="24h" data-i18n="h24">24-Hour</option>
                  <option value="12h" data-i18n="h12">12-Hour</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-1">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="settingShowSeconds" class="rounded bg-zinc-900 border-zinc-700 text-blue-500">
                <span data-i18n="showSeconds">Show Seconds</span>
              </label>
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="settingShowDate" class="rounded bg-zinc-900 border-zinc-700 text-blue-500">
                <span data-i18n="showDate">Show Date</span>
              </label>
            </div>
          </section>

          <section class="space-y-3 border-t border-zinc-800 pt-4">
            <h4 class="text-[11px] font-bold uppercase tracking-wider text-zinc-500 flex items-center gap-1.5">
              <i class="fa-solid fa-palette"></i>
              <span data-i18n="colorTheme">Styles & Appearance</span>
            </h4>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="language">Language</label>
                <select id="settingLanguage" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="en">English (EN)</option>
                  <option value="kh">ភាសាខ្មែរ (KH)</option>
                </select>
              </div>
              <div>
                <label class="block mb-1 text-zinc-400">Mode</label>
                <select id="settingColorScheme" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="dark">Dark Mode</option>
                  <option value="light">Light Mode</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="colorTheme">Color Theme</label>
                <select id="settingTheme" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="midnight">Midnight</option>
                  <option value="graphite">Graphite</option>
                  <option value="oled">OLED Black</option>
                  <option value="arctic">Arctic</option>
                  <option value="aurora">Aurora</option>
                  <option value="minimal-white">Minimal White</option>
                </select>
              </div>
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="accentColor">Accent Color</label>
                <select id="settingAccent" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="white">White</option>
                  <option value="blue">Blue</option>
                  <option value="cyan">Cyan</option>
                  <option value="green">Green</option>
                  <option value="purple">Purple</option>
                  <option value="orange">Orange</option>
                </select>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="digitalStyle">Digital Style</label>
                <select id="settingDigitalStyle" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="modern">Modern</option>
                  <option value="minimal">Minimal</option>
                  <option value="thin">Thin</option>
                  <option value="bold">Bold</option>
                  <option value="matrix">Matrix Tech</option>
                </select>
              </div>
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="analogStyle">Analog Style</label>
                <select id="settingAnalogStyle" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="minimal">Minimal</option>
                  <option value="classic">Classic (12,3,6,9)</option>
                  <option value="full">Full Numbers</option>
                </select>
              </div>
            </div>

            <div class="pt-1">
              <div class="flex justify-between items-center mb-1">
                <label class="text-zinc-400" data-i18n="fontSize">Digital Font Size</label>
                <span id="fontSizeVal" class="text-xs font-bold text-blue-400">100%</span>
              </div>
              <input type="range" id="settingDigitalFontSize" min="60" max="160" step="5" value="100" class="w-full accent-blue-500 bg-zinc-800 rounded-lg cursor-pointer">
            </div>

            <div class="pt-2">
              <label class="block mb-1 text-zinc-400" data-i18n="wallpaperUrl">Wallpaper Image URL</label>
              <div class="flex gap-2">
                <input type="url" id="settingWallpaperUrl" placeholder="https://images.unsplash.com/photo-..." class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white text-xs">
                <button id="clearWallpaperBtn" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-lg text-xs transition">Clear</button>
              </div>
            </div>
          </section>

          <section class="space-y-3 border-t border-zinc-800 pt-4">
            <h4 class="text-[11px] font-bold uppercase tracking-wider text-zinc-500 flex items-center gap-1.5">
              <i class="fa-solid fa-chart-pie"></i>
              <span data-i18n="weather">Widgets & Data</span>
            </h4>
            <div class="grid grid-cols-2 gap-3">
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="settingShowWeather" class="rounded bg-zinc-900 border-zinc-700 text-blue-500">
                <span data-i18n="weather">Weather</span>
              </label>
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="settingShowBattery" class="rounded bg-zinc-900 border-zinc-700 text-blue-500">
                <span data-i18n="battery">Battery</span>
              </label>
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="settingShowNetwork" class="rounded bg-zinc-900 border-zinc-700 text-blue-500">
                <span data-i18n="network">Network Status</span>
              </label>
              <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="settingShowTimezone" class="rounded bg-zinc-900 border-zinc-700 text-blue-500">
                <span data-i18n="timezone">Timezone Tag</span>
              </label>
            </div>
          </section>

          <section class="space-y-3 border-t border-zinc-800 pt-4">
            <h4 class="text-[11px] font-bold uppercase tracking-wider text-zinc-500 flex items-center gap-1.5">
              <i class="fa-solid fa-bolt"></i>
              <span data-i18n="nightMode">Behavior & Power</span>
            </h4>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block mb-1 text-zinc-400" data-i18n="nightMode">Night Mode</label>
                <select id="settingNightMode" class="w-full bg-zinc-900 border border-zinc-700 rounded-lg p-2 text-white">
                  <option value="auto" data-i18n="auto">Auto (22:00 - 07:00)</option>
                  <option value="on" data-i18n="on">Always On</option>
                  <option value="off" data-i18n="off">Off</option>
                </select>
              </div>
              <div class="flex flex-col justify-end">
                <label class="flex items-center space-x-2 cursor-pointer mb-2">
                  <input type="checkbox" id="settingWakeLock" class="rounded bg-zinc-900 border-zinc-700 text-blue-500">
                  <span data-i18n="keepAwake">Keep Screen Awake</span>
                </label>
              </div>
            </div>
          </section>

          <div class="border-t border-zinc-800 pt-4 flex justify-between items-center">
            <button id="resetSettingsBtn" class="px-3 py-1.5 bg-red-950/40 text-red-400 border border-red-900/50 rounded-lg hover:bg-red-900/50 transition flex items-center gap-1.5">
              <i class="fa-solid fa-rotate-left"></i>
              <span data-i18n="resetSettings">Reset All Settings</span>
            </button>
            <button id="saveSettingsCloseBtn" class="px-4 py-1.5 bg-white text-black font-semibold rounded-lg hover:bg-zinc-200 transition" data-i18n="done">Done</button>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="js/settings.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/analog-clock.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/device.js"></script>
  <script src="js/fullscreen.js"></script>
  <script src="js/wake-lock.js"></script>
  <script src="js/world-clock.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }
  </script>
</body>
</html>
